name: beesports
description: A sports matchmaking application for BINUS students.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter_animate: ^4.5.2
  flutter_bloc: ^8.1.6
  flutter_dotenv: ^5.1.0
  flutter_map: ^8.3.0
  get_it: ^7.7.0
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.17.0
  go_router: ^14.0.0
  image_picker: ^1.0.4
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  supabase_flutter: ^2.0.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - icon.jpg

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: icon.jpg
