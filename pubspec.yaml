name: beesports
description: "A sports matchmaking application for BINUS students."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  get_it: ^7.7.0

  go_router: ^14.0.0

  supabase_flutter: ^2.0.2

  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.4

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - icon.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon.jpg"
